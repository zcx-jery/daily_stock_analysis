name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发
    inputs:
      deploy_ref:
        description: "Git branch or tag to deploy. Defaults to the workflow ref."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_REF="${{ github.event.inputs.deploy_ref || github.ref_name }}"
            if [ -z "$DEPLOY_REF" ]; then
              DEPLOY_REF="main"
            fi
            git fetch origin "$DEPLOY_REF"
            git switch "$DEPLOY_REF" || git switch -c "$DEPLOY_REF" "origin/$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF"
            bash scripts/deploy-docker.sh rebuild server
            docker image prune -f
