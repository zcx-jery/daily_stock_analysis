# 涨停股筛选系统配置文件

# ==================== 筛选参数 ====================

# 默认输出 TOP N 只股票
TOP_N=5

# 默认最小涨幅阈值（%）
MIN_CHANGE_PCT=7.0

# 是否排除创业板 (300) 和科创板 (688)
EXCLUDE_GEM_STAR=true

# ==================== 评分权重 ====================

# 涨幅评分权重（0-1）
WEIGHT_CHANGE=0.3

# 量能评分权重（0-1）
WEIGHT_AMOUNT=0.3

# 换手率评分权重（0-1）
WEIGHT_TURNOVER=0.2

# 量比评分权重（0-1）
WEIGHT_VOLUME_RATIO=0.2

# 题材加成上限（0-2 分）
SECTOR_BONUS_MAX=2

# ==================== 飞书通知 ====================

# 是否启用飞书通知（true/false）
FEISHU_NOTIFY=true

# 飞书应用 ID（从飞书开放平台获取）
FEISHU_APP_ID=cli_a943a199d4389bc2

# 飞书应用 Secret（从飞书开放平台获取）
FEISHU_APP_SECRET=CoJS5GyD1DYFHN3W4drrXgysD6itc2PO

# 飞书群聊 ID
FEISHU_CHAT_ID=oc_5ae90f746fe1d1120880e3f8fb56a22c

# ==================== 自动化调度 ====================

# 是否启用定时任务（true/false）
AUTO_SCHEDULE=false

# 执行时间（cron 格式，默认交易日 15:30）
SCHEDULE_CRON="30 15 * * 1-5"

# ==================== 回测配置 ====================

# 默认回测开始日期
BACKTEST_START_DATE=2025-01-01

# 默认回测结束日期
BACKTEST_END_DATE=2025-12-31

# 默认持仓天数
BACKTEST_HOLDING_DAYS=1

# 默认止损阈值（%）
BACKTEST_STOP_LOSS=-5.0

# 默认止盈阈值（%）
BACKTEST_TAKE_PROFIT=10.0

# 是否生成可视化图表
BACKTEST_VISUALIZE=true

# ==================== 仓位管理 ====================

# 单只股票最大仓位（%）
MAX_POSITION_PER_STOCK=30

# 总仓位上限（%）
MAX_TOTAL_POSITION=80

# 评分>=9 分的目标仓位（%）
POSITION_SCORE_9=30

# 评分>=8 分的目标仓位（%）
POSITION_SCORE_8=20

# 评分>=7 分的目标仓位（%）
POSITION_SCORE_7=15

# 评分<7 分的目标仓位（%）
POSITION_SCORE_LOW=10
